{% set keywords = (tool.keywords or [])|join(' ') %}
<article class="tool-card" data-tool-card data-slug="{{ tool.slug }}" data-name="{{ tool.name|lower }}" data-description="{{ tool.description|lower }}" data-category="{{ tool.category|lower }}" data-keywords="{{ keywords|lower }}">
  <div class="tool-card-icon" aria-hidden="true">
    <img src="{{ url_for('static', filename='icons/' + tool.icon + '.svg') }}" alt="" width="24" height="24" loading="lazy">
  </div>
  <div class="tool-card-body">
    <div class="tool-card-heading">
      <h3><a class="tool-card-link" href="{{ tool.route }}">{{ tool.name }}</a></h3>
      <button class="favorite-button" type="button" data-favorite="{{ tool.slug }}" aria-label="Add {{ tool.name }} to favorites" aria-pressed="false"><svg class="favorite-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
    </div>
    <p>{{ tool.description }}</p>
    <p class="tool-card-meta"><span class="tool-category-badge">{{ tool.category }}</span><span class="tool-processing-label"> · {{ tool.processing }}</span></p>
  </div>
</article>

{% set is_active = tool.status in ['active', 'available'] %}
{% set keywords = (tool.keywords or [])|join(' ') %}
{% if is_active %}
<a class="tool-card" href="{{ tool.route }}" data-tool-card data-slug="{{ tool.slug }}" data-name="{{ tool.name|lower }}" data-description="{{ tool.description|lower }}" data-category="{{ tool.category|lower }}" data-keywords="{{ keywords|lower }}">
{% else %}
<article class="tool-card tool-card--soon" data-tool-card data-slug="{{ tool.slug }}" data-name="{{ tool.name|lower }}" data-description="{{ tool.description|lower }}" data-category="{{ tool.category|lower }}" data-keywords="{{ keywords|lower }}">
{% endif %}
  <div class="tool-card-icon" aria-hidden="true">
    <img src="{{ url_for('static', filename='icons/' + tool.icon + '.svg') }}" alt="" width="24" height="24">
  </div>
  <div class="tool-card-body">
    <div class="tool-card-heading">
      <h3>{{ tool.name }}</h3>
    </div>
    <p>{{ tool.description }}</p>
    <p class="tool-card-meta">{{ tool.category }}</p>
  </div>
{% if is_active %}
</a>
{% else %}
</article>
{% endif %}

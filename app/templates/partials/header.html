<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ url_for('main.index') }}">
      <img src="{{ url_for('static', filename='icons/logo.svg') }}" alt="" width="28" height="28">
      <span>Toolbox</span>
    </a>
    <nav id="site-nav" class="site-nav" data-nav>
      <ul>
        <li><a href="{{ url_for('main.index') }}" {% if request.path == '/' %}aria-current="page"{% endif %}>Home</a></li>
        <li><a href="{{ url_for('main.tools') }}" {% if request.path.startswith('/tools') %}aria-current="page"{% endif %}>Tools</a></li>
        <li><a href="{{ url_for('main.tools') }}#categories">Categories</a></li>
        <li><a href="{{ url_for('main.about') }}" {% if request.path == '/about' %}aria-current="page"{% endif %}>About &amp; data</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.2 8.2 0 0 1 8.8 4a8.3 8.3 0 1 0 11.2 11.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
        <span class="visually-hidden">Menu</span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-bar" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
